name: Fetch AI news

on:
  schedule:
    - cron: "0 6 * * *" # daglig 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch news
        run: npm run fetch-news

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/updates
          if git diff --cached --quiet; then
            echo "Ingen nye oppdateringer."
          else
            git commit -m "Automatisk nyhetsoppdatering"
            git push
          fi
